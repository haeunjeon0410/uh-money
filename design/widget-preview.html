<!doctype html><html><body style="margin:0;background:#000;padding:24px;display:flex;gap:30px">
<div id="a"></div><div id="b"></div><div id="c"></div>
<script>
const S=160, G={"ringCy": 62.0, "ringD": 108.0, "ringLw": 10.0, "badgeSize": 11.0, "badgeGap": 7.0, "iconY": 128.0, "iconSize": 17.0, "barY": 148.0, "barW": 16.0, "barH": 3.0, "sideMargin": 20.0}, K=2.2;
const COL={exercise:0,study:1,commit:2,malhae:3,psat:4,noSpend:0,keptLimit:1,noDelivery:2,onTime:3};
const icon=(key,row,x,y,w)=>`<div style="position:absolute;left:${x*K}px;top:${y*K}px;width:${w*K}px;height:${w*K}px;background:url(../widget/assets/icons-v1.png) -${COL[key]*w*K}px -${row*w*K}px/${5*w*K}px ${4*w*K}px no-repeat"></div>`;
const bar=(x,y,p,c)=>`<div style="position:absolute;left:${x*K}px;top:${y*K}px;width:${G.barW*K}px;height:${G.barH*K}px;border-radius:3px;background:#2c2c2e;overflow:hidden"><div style="width:${p*100}%;height:100%;background:${c}"></div></div>`;
function widget(o){
  const cx=S/2,cy=G.ringCy,r=(G.ringD-G.ringLw)/2;
  let h=`<svg style="position:absolute;left:0;top:0" width="${S*K}" height="${S*K}"><g transform="scale(${K})">
   <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2c2c2e" stroke-width="${G.ringLw}"/>
   <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${o.over?'#ff453a':'#30d158'}" stroke-width="${G.ringLw}" stroke-linecap="round" stroke-dasharray="${2*Math.PI*r*o.pct} 999" transform="rotate(-90 ${cx} ${cy})"/>
   <text x="${cx}" y="${cy+o.fs*0.36}" text-anchor="middle" fill="${o.over?'#ff453a':'#fff'}" font-size="${o.fs}" font-weight="700">${o.num}</text>
   <line x1="${cx}" y1="0" x2="${cx}" y2="${S}" stroke="#ff453a" stroke-width=".3" stroke-dasharray="2 2"/></g></svg>`;
  const by=cy+o.fs*0.55+3;
  let bx=cx-(o.badges.length*G.badgeSize+(o.badges.length-1)*G.badgeGap)/2;
  for(const k of o.badges){h+=icon(k,3,bx,by,G.badgeSize);bx+=G.badgeSize+G.badgeGap;}
  const keys=['exercise','study','commit','malhae','psat'],cols=['#ff9f0a','#bf5af2','#0a84ff','#64d2ff','#ffd60a'],colW=(S-G.sideMargin*2)/5;
  keys.forEach((k,i)=>{const mid=G.sideMargin+colW*(i+.5),p=o.p[i];h+=icon(k,p>0?0:1,mid-G.iconSize/2,G.iconY,G.iconSize)+bar(mid-G.barW/2,G.barY,p,cols[i]);});
  return `<div style="position:relative;width:${S*K}px;height:${S*K}px;border-radius:${36*K}px;background:#1c1c1e;overflow:hidden">${h}</div>`;
}
a.innerHTML=widget({pct:.6,over:false,num:'37,500',fs:19.4,badges:['noSpend','keptLimit','noDelivery'],p:[1,.4,0,0,1]});
b.innerHTML=widget({pct:1,over:false,num:'104,200',fs:16.7,badges:['noSpend','keptLimit','noDelivery','onTime'],p:[0,0,0,0,0]});
c.innerHTML=widget({pct:1,over:true,num:'−3,000',fs:16.5,badges:[],p:[0,0,0,0,0]});
</script></body></html>
